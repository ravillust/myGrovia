name: Publish privacy policy

on:
  push:
    branches: [main]
    paths:
      - 'privacy/**'
      - 'assets/data/privacy_policy.json'
      - 'tool/generate_privacy_page.py'
      - '.github/workflows/privacy-pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Generate policy from the app asset
        run: python tool/generate_privacy_page.py
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: privacy
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy policy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
