name: Publish privacy policy

on:
  push:
    branches: [main]
    paths:
      - 'privacy/**'
      - 'assets/data/privacy_policy.json'
      - 'tool/generate_privacy_page.py'
      - '.github/workflows/privacy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate policy from the app asset
        run: python tool/generate_privacy_page.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: privacy
      - name: Deploy policy
        id: deployment
        uses: actions/deploy-pages@v4
