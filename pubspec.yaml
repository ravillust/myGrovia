name: my_grovia
description: "Offline plant collection and watering journal."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  image_picker: 1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  uuid: 4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
  assets:
    - assets/branding/mygrovia_logo.png
    - assets/illustration/empty_collection_plant.svg
    - assets/plants/catalog/
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/data/

flutter_launcher_icons:
  android: true
  image_path: "assets/branding/mygrovia_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/branding/mygrovia_logo.png"
  image_dark: "assets/branding/mygrovia_logo.png"
  android: true
  ios: false
  web: false

  android_12:
    color: "#ffffff"
    color_dark: "#ffffff"
    image: "assets/branding/mygrovia_logo.png"
    image_dark: "assets/branding/mygrovia_logo.png"
